<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-labelledby="t d" lang="en">
<title id="t">How the nodes of Forma connect to the Kanban board</title>
<desc id="d">A Kanban board with vertical columns: Backlog is Spec, To Do is Kit, In Progress is Run, Review is Intent, Done is accepted work. Two arcs above the board: Spec slices cards for Run, Kit prepares the infrastructure for Intent, which defines the end result. The arcs cross: Kit and Intent are the spacers between Spec and Run, Spec and Run are the spacers between Kit and Intent. Below the board lies Core as a layer tied to every column: it holds the balance and gives the cycle verdict.</desc>
