<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" role="img" aria-labelledby="t d" lang="en">
<title id="t">Card anatomy</title>
<desc id="d">Card anatomy: four zones - Task, Kit, History, Result; Task has five fields, Kit has six units.</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#f2f6fb;font-size:12px;text-anchor:middle}
.h{font-family:Consolas,Menlo,monospace;font-weight:700;font-size:15px}
.m{fill:#b9cce5}.l{text-anchor:start}.e{text-anchor:end}
.z{fill:#1d3b68;stroke:#8fb2dc;stroke-width:1.5}
.ac{fill:#93c8f7}
.c{fill:#13294b;stroke:#8fb2dc}
</style>
<rect width="900" height="480" rx="10" fill="#13294b"/>
<text class="h l" x="30" y="34">card-NNN</text>

<rect class="z" x="30" y="50" width="840" height="100" rx="8"/><rect class="ac" x="30" y="50" width="6" height="100" rx="3"/>
<text class="h l" x="52" y="76">## Task</text><text class="m e" x="850" y="76">written by Spec</text>
<rect class="c" x="50" y="94" width="152" height="36" rx="6"/><text x="126" y="117">1 · kind</text>
<rect class="c" x="212" y="94" width="152" height="36" rx="6"/><text x="288" y="117">2 · delivers</text>
<rect class="c" x="374" y="94" width="152" height="36" rx="6"/><text x="450" y="117">3 · criterion</text>
<rect class="c" x="536" y="94" width="152" height="36" rx="6"/><text x="612" y="117">4 · attempt budget</text>
<rect class="c" x="698" y="94" width="152" height="36" rx="6"/><text x="774" y="117">5 · next</text>

<rect class="z" x="30" y="165" width="840" height="100" rx="8"/><rect class="ac" x="30" y="165" width="6" height="100" rx="3"/>
<text class="h l" x="52" y="191">## Kit</text><text class="m e" x="850" y="191">written by Kit (or Spec, from a ready profile)</text>
<rect class="c" x="50" y="209" width="125" height="36" rx="6"/><text x="112" y="232">1 · role</text>
<rect class="c" x="185" y="209" width="125" height="36" rx="6"/><text x="247" y="232">2 · skill</text>
<rect class="c" x="320" y="209" width="125" height="36" rx="6"/><text x="382" y="232">3 · tool</text>
<rect class="c" x="455" y="209" width="125" height="36" rx="6"/><text x="517" y="232">4 · access</text>
<rect class="c" x="590" y="209" width="125" height="36" rx="6"/><text x="652" y="232">5 · data</text>
<rect class="c" x="725" y="209" width="125" height="36" rx="6"/><text x="787" y="232">6 · model</text>

<rect class="z" x="30" y="280" width="840" height="70" rx="8"/><rect class="ac" x="30" y="280" width="6" height="70" rx="3"/>
<text class="h l" x="52" y="306">## History</text><text class="m e" x="850" y="306">each node adds its own lines</text>
<text class="l" x="52" y="335">Spend line per call, route and stage lines. Only added, never overwritten.</text>

<rect class="z" x="30" y="365" width="840" height="70" rx="8"/><rect class="ac" x="30" y="365" width="6" height="70" rx="3"/>
<text class="h l" x="52" y="391">## Result</text><text class="m e" x="850" y="391">written by Run, once done</text>
<text class="l" x="52" y="420">What actually came out and how it was confirmed. Empty until executed.</text>

<text class="m" x="450" y="462">Task: five fields. Kit: six units.</text>
</svg>
