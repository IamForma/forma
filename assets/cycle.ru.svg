<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" width="900" height="640" role="img" aria-labelledby="t d" lang="ru">
<title id="t">Цикл работы: топология пятёрки</title>
<desc id="d">Топология цикла: слева внизу Intent открывает цель, слева вверху Spec нарезает её на карточки, к Spec пристыкован Plumb и читает, подходит ли роль; справа вверху Kit собирает снаряжение, справа внизу Run исполняет; Intent проверяет, человек принимает, в центре Core выносит вердикт по кругу. Непройденная проверка возвращается в Kit, непройденный вердикт — к названному узлу.</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#f2f6fb;font-size:11px;text-anchor:middle}
.b{font-family:Consolas,Menlo,monospace;font-weight:700;font-size:17px}
.m{fill:#b9cce5}.y{fill:#ffc266}.k{fill:#ff8a76}.c{fill:#93c8f7}.l{text-anchor:start}.e{text-anchor:end}
.nd{fill:#1d3b68;stroke:#8fb2dc;stroke-width:1.5}
.fw{fill:none;stroke:#f2f6fb;stroke-width:2}
.rt{fill:none;stroke:#ffc266;stroke-width:2;stroke-dasharray:6 5}
.cr{fill:none;stroke:#ff8a76;stroke-width:2;stroke-dasharray:6 5}
</style>
<defs>
<marker id="af" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#f2f6fb"/></marker>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ffc266"/></marker>
<marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#ff8a76"/></marker>
</defs>
<rect width="900" height="640" rx="10" fill="#13294b"/>

<!-- Core to the four nodes: not reached -->
<polyline class="cr" points="350,240 244,170" marker-end="url(#ak)"/>
<polyline class="cr" points="550,240 656,170" marker-end="url(#ak)"/>
<polyline class="cr" points="350,310 244,430" marker-end="url(#ak)"/>
<polyline class="cr" points="550,310 656,430" marker-end="url(#ak)"/>
<text class="k" x="450" y="218" style="font-size:10.5px">не достигнуто: названный узел</text>

<!-- Intent to Spec (slicing) -->
<polyline class="fw" points="140,400 140,152" marker-end="url(#af)"/>
<text class="e" x="130" y="285">нарезка</text><circle cx="140" cy="262" r="11" fill="#ffc266"/><text x="140" y="266" style="fill:#13294b;font-weight:700;font-size:12px">2</text>
<!-- Spec to Plumb dock -->
<line x1="240" y1="106" x2="268" y2="106" stroke="#93c8f7" stroke-width="3"/>
<!-- Plumb to Kit (role does not fit) -->
<polyline class="fw" points="408,106 658,106" marker-end="url(#af)"/>
<text x="533" y="96">роль не подходит</text>
<!-- Plumb to Run (role fits) -->
<polyline class="fw" points="340,130 340,470 658,470" marker-end="url(#af)"/>
<text x="520" y="462">роль подходит</text>
<!-- Kit to Run -->
<polyline class="fw" points="760,152 760,400" marker-end="url(#af)"/>
<text class="l" x="770" y="285">снаряжено</text>
<!-- Run to Intent (check) -->
<polyline class="fw" points="760,510 760,560 140,560 140,512" marker-end="url(#af)"/>
<text x="450" y="552">проверка</text><circle cx="450" cy="574" r="11" fill="#ffc266"/><text x="450" y="578" style="fill:#13294b;font-weight:700;font-size:12px">6</text>
<!-- Intent to human to Core -->
<polyline class="fw" points="240,440 412,408" marker-end="url(#af)"/>
<text x="300" y="414">приёмка</text>
<circle cx="450" cy="372" r="8" fill="#f2f6fb"/>
<path d="M450 380 V400 M438 387 H462 M450 400 L441 413 M450 400 L459 413" stroke="#f2f6fb" stroke-width="3" fill="none" stroke-linecap="round"/>
<text x="450" y="432" style="font-size:12px">человек</text><circle cx="326" cy="436" r="11" fill="#ffc266"/><text x="326" y="440" style="fill:#13294b;font-weight:700;font-size:12px">7</text>
<polyline class="fw" points="450,352 450,328" marker-end="url(#af)"/>
<text class="l" x="460" y="345">вердикт</text>
<!-- return: failed check to Kit -->
<polyline class="rt" points="40,455 14,455 14,26 760,26 760,58" marker-end="url(#ar)"/>
<text class="y" x="387" y="20">проверка не пройдена: в Kit</text>

<!-- nodes -->
<rect class="nd" x="40" y="60" width="200" height="92" rx="8"/><text class="b" x="140" y="96">Spec</text><text class="m" x="140" y="118">нарезка на карточки</text>
<rect class="nd" x="660" y="60" width="200" height="92" rx="8"/><text class="b" x="760" y="96">Kit</text><text class="m" x="760" y="118">снаряжение, роль</text>
<rect class="nd" x="40" y="400" width="200" height="112" rx="8"/><text class="b" x="140" y="446">Intent</text><text class="m" x="140" y="468">открывает цель</text>
<rect class="nd" x="660" y="400" width="200" height="112" rx="8"/><text class="b" x="760" y="446">Run</text><text class="m" x="760" y="468">исполнение</text>
<rect x="350" y="240" width="200" height="70" rx="8" fill="#1d3b68" stroke="#ff8a76" stroke-width="2"/><text class="b k" x="450" y="270">Core</text><text class="m" x="450" y="290">вердикт по кругу</text>
<rect x="268" y="84" width="140" height="44" rx="22" fill="#1d3b68" stroke="#93c8f7" stroke-width="1.5" stroke-dasharray="6 4"/>
<text class="b" x="338" y="104" style="font-size:14px">Plumb</text><text class="m" x="338" y="120" style="font-size:10px">мера, не узел</text>
<circle cx="56" cy="418" r="11" fill="#ffc266"/><text x="56" y="422" style="fill:#13294b;font-weight:700;font-size:12px">1</text><circle cx="268" cy="84" r="11" fill="#ffc266"/><text x="268" y="88" style="fill:#13294b;font-weight:700;font-size:12px">3</text><circle cx="676" cy="78" r="11" fill="#ffc266"/><text x="676" y="82" style="fill:#13294b;font-weight:700;font-size:12px">4</text><circle cx="676" cy="418" r="11" fill="#ffc266"/><text x="676" y="422" style="fill:#13294b;font-weight:700;font-size:12px">5</text><circle cx="366" cy="258" r="11" fill="#ffc266"/><text x="366" y="262" style="fill:#13294b;font-weight:700;font-size:12px">8</text>

<line x1="150" y1="620" x2="190" y2="620" stroke="#f2f6fb" stroke-width="2"/><text class="l m" x="196" y="624">основной ход</text>
<line x1="350" y1="620" x2="390" y2="620" stroke="#ffc266" stroke-width="2" stroke-dasharray="6 5"/><text class="l m" x="396" y="624">возврат</text>
<line x1="560" y1="620" x2="600" y2="620" stroke="#ff8a76" stroke-width="2" stroke-dasharray="6 5"/><text class="l m" x="606" y="624">возврат по вердикту Core</text>
</svg>
