<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480" role="img" aria-labelledby="t d" lang="ru">
<title id="t">Устройство карточки</title>
<desc id="d">Устройство карточки: четыре зоны — Задача, Снаряжение, История, Результат; в задаче пять полей, в снаряжении шесть единиц.</desc>
<style>
text{font-family:Arial,Helvetica,sans-serif;fill:#f2f6fb;font-size:12px;text-anchor:middle}
.h{font-family:Consolas,Menlo,monospace;font-weight:700;font-size:15px}
.m{fill:#b9cce5}.l{text-anchor:start}.e{text-anchor:end}
.z{fill:#1d3b68;stroke:#8fb2dc;stroke-width:1.5}
.ac{fill:#93c8f7}
.c{fill:#13294b;stroke:#8fb2dc}
</style>
<rect width="900" height="480" rx="10" fill="#13294b"/>
<text class="h l" x="30" y="34">card-NNN</text>

<rect class="z" x="30" y="50" width="840" height="100" rx="8"/><rect class="ac" x="30" y="50" width="6" height="100" rx="3"/>
<text class="h l" x="52" y="76">## Задача</text><text class="m e" x="850" y="76">пишет Spec</text>
<rect class="c" x="50" y="94" width="152" height="36" rx="6"/><text x="126" y="117">1 · вид</text>
<rect class="c" x="212" y="94" width="152" height="36" rx="6"/><text x="288" y="117">2 · что даёт</text>
<rect class="c" x="374" y="94" width="152" height="36" rx="6"/><text x="450" y="117">3 · критерий</text>
<rect class="c" x="536" y="94" width="152" height="36" rx="6"/><text x="612" y="117">4 · бюджет попыток</text>
<rect class="c" x="698" y="94" width="152" height="36" rx="6"/><text x="774" y="117">5 · куда дальше</text>

<rect class="z" x="30" y="165" width="840" height="100" rx="8"/><rect class="ac" x="30" y="165" width="6" height="100" rx="3"/>
<text class="h l" x="52" y="191">## Снаряжение</text><text class="m e" x="850" y="191">пишет Kit (или Spec, по готовому профилю)</text>
<rect class="c" x="50" y="209" width="125" height="36" rx="6"/><text x="112" y="232">1 · роль</text>
<rect class="c" x="185" y="209" width="125" height="36" rx="6"/><text x="247" y="232">2 · навык</text>
<rect class="c" x="320" y="209" width="125" height="36" rx="6"/><text x="382" y="232">3 · инструмент</text>
<rect class="c" x="455" y="209" width="125" height="36" rx="6"/><text x="517" y="232">4 · доступ</text>
<rect class="c" x="590" y="209" width="125" height="36" rx="6"/><text x="652" y="232">5 · данные</text>
<rect class="c" x="725" y="209" width="125" height="36" rx="6"/><text x="787" y="232">6 · модель</text>

<rect class="z" x="30" y="280" width="840" height="70" rx="8"/><rect class="ac" x="30" y="280" width="6" height="70" rx="3"/>
<text class="h l" x="52" y="306">## История</text><text class="m e" x="850" y="306">каждый узел добавляет свои строки</text>
<text class="l" x="52" y="335">Строка расхода на каждый вызов, строки маршрута и этапа. Только дописывается.</text>

<rect class="z" x="30" y="365" width="840" height="70" rx="8"/><rect class="ac" x="30" y="365" width="6" height="70" rx="3"/>
<text class="h l" x="52" y="391">## Результат</text><text class="m e" x="850" y="391">пишет Run после исполнения</text>
<text class="l" x="52" y="420">Что получилось на деле и чем подтверждено. Пусто до исполнения.</text>

<text class="m" x="450" y="462">Задача: пять полей. Снаряжение: шесть единиц.</text>
</svg>
