<svg viewBox="0 0 920 640" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Пять узлов — маршрут круга, квадратом">
  <defs>
    <marker id="ah-forward" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#eaf2fb"/>
    </marker>
    <marker id="ah-return" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ffcc7a"/>
    </marker>
    <marker id="ah-core" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a9d0f5"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="920" height="640" fill="#0f2a4a"/>

  <!-- forward flow, по часовой стрелке: Intent(BL) -> Spec(TL) -> Kit(TR) -> Run(BR) -> Intent -->
  <line x1="120" y1="470" x2="120" y2="178" stroke="#eaf2fb" stroke-width="2" marker-end="url(#ah-forward)"/>
  <text x="108" y="325" text-anchor="end" font-family="Consolas, monospace" font-size="12" fill="#eaf2fb" transform="rotate(-90 108 325)">нарезка</text>

  <line x1="260" y1="90" x2="652" y2="90" stroke="#eaf2fb" stroke-width="2" marker-end="url(#ah-forward)"/>
  <text x="460" y="82" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#eaf2fb">снаряжение</text>

  <line x1="800" y1="170" x2="800" y2="462" stroke="#eaf2fb" stroke-width="2" marker-end="url(#ah-forward)"/>
  <text x="812" y="325" text-anchor="start" font-family="Consolas, monospace" font-size="12" fill="#eaf2fb" transform="rotate(-90 812 325)">исполнение</text>

  <line x1="660" y1="520" x2="268" y2="520" stroke="#eaf2fb" stroke-width="2" marker-end="url(#ah-forward)"/>
  <text x="460" y="512" text-anchor="middle" font-family="Consolas, monospace" font-size="12" fill="#eaf2fb">сверка</text>

  <!-- return / escalation paths -->
  <line x1="180" y1="170" x2="180" y2="462" stroke="#ffcc7a" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#ah-return)"/>
  <text x="195" y="325" text-anchor="end" font-family="Consolas, monospace" font-size="11" fill="#ffcc7a" transform="rotate(-90 195 325)">образ непригоден</text>

  <line x1="660" y1="125" x2="268" y2="125" stroke="#ffcc7a" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#ah-return)"/>
  <text x="460" y="142" text-anchor="middle" font-family="Consolas, monospace" font-size="11" fill="#ffcc7a">дело в карточке</text>

  <line x1="740" y1="470" x2="740" y2="178" stroke="#ffcc7a" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#ah-return)"/>
  <text x="728" y="325" text-anchor="end" font-family="Consolas, monospace" font-size="11" fill="#ffcc7a" transform="rotate(-90 728 325)">не хватает пункта формы</text>

  <polyline points="260,580 900,580 900,95 888,95" fill="none" stroke="#ffcc7a" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#ah-return)"/>
  <text x="912" y="337" text-anchor="end" font-family="Consolas, monospace" font-size="11" fill="#ffcc7a" transform="rotate(-90 912 337)">сверка не прошла</text>

  <!-- Core oversight -->
  <line x1="360" y1="280" x2="260" y2="170" stroke="#a9d0f5" stroke-width="1.8" stroke-dasharray="2 4" marker-end="url(#ah-core)"/>
  <line x1="560" y1="280" x2="660" y2="170" stroke="#a9d0f5" stroke-width="1.8" stroke-dasharray="2 4" marker-end="url(#ah-core)"/>
  <line x1="560" y1="360" x2="660" y2="470" stroke="#a9d0f5" stroke-width="1.8" stroke-dasharray="2 4" marker-end="url(#ah-core)"/>
  <line x1="360" y1="360" x2="260" y2="470" stroke="#a9d0f5" stroke-width="1.8" stroke-dasharray="2 4" marker-end="url(#ah-core)"/>

  <!-- Spec (top-left) -->
  <rect x="40" y="40" width="220" height="130" fill="#0f2a4a" stroke="#6f9bd1"/>
  <rect x="40" y="40" width="5" height="130" fill="#a8ecff"/>
  <text x="150" y="68" text-anchor="middle" font-family="Consolas, monospace" font-weight="700" font-size="17" fill="#eaf2fb">SPEC</text>
  <text x="150" y="86" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#9db8d6">Спецификация</text>
  <text x="150" y="110" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#6f8fb3">карточка — верх</text>
  <text x="150" y="124" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#6f8fb3">история — передел</text>

  <!-- Kit (top-right) -->
  <rect x="660" y="40" width="220" height="130" fill="#0f2a4a" stroke="#6f9bd1"/>
  <rect x="660" y="40" width="5" height="130" fill="#a3c1ff"/>
  <text x="770" y="68" text-anchor="middle" font-family="Consolas, monospace" font-weight="700" font-size="17" fill="#eaf2fb">KIT</text>
  <text x="770" y="86" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#9db8d6">Снаряжение</text>
  <text x="770" y="110" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#6f8fb3">карточка — низ, история</text>
  <text x="770" y="124" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#6f8fb3">.claude/skills/, PROJECT.md</text>

  <!-- Run (bottom-right) -->
  <rect x="660" y="470" width="220" height="130" fill="#0f2a4a" stroke="#6f9bd1"/>
  <rect x="660" y="470" width="5" height="130" fill="#7be0a8"/>
  <text x="770" y="498" text-anchor="middle" font-family="Consolas, monospace" font-weight="700" font-size="17" fill="#eaf2fb">RUN</text>
  <text x="770" y="516" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#9db8d6">Исполнение</text>
  <text x="770" y="540" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#6f8fb3">карточка — результат</text>
  <text x="770" y="554" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#6f8fb3">scratch/</text>

  <!-- Intent (bottom-left) -->
  <rect x="40" y="470" width="220" height="130" fill="#0f2a4a" stroke="#6f9bd1"/>
  <rect x="40" y="470" width="5" height="130" fill="#b98cff"/>
  <text x="150" y="498" text-anchor="middle" font-family="Consolas, monospace" font-weight="700" font-size="17" fill="#eaf2fb">INTENT</text>
  <text x="150" y="516" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11.5" fill="#9db8d6">Замысел</text>
  <text x="150" y="540" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#6f8fb3">brief/, GOAL.md,</text>
  <text x="150" y="554" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#6f8fb3">JOURNAL.md, VARS/,</text>
  <text x="150" y="568" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#6f8fb3">ROADMAP.md, история</text>

  <!-- Человек — стоит прямо на блоке Intent (сверху, не внутри): только сюда он приходит с разговором -->
  <g>
    <circle cx="75" cy="426" r="8" fill="#f4f1ea"/>
    <line x1="75" y1="434" x2="75" y2="455" stroke="#f4f1ea" stroke-width="3" stroke-linecap="round"/>
    <line x1="63" y1="443" x2="87" y2="443" stroke="#f4f1ea" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="75" y1="455" x2="65" y2="470" stroke="#f4f1ea" stroke-width="3" stroke-linecap="round"/>
    <line x1="75" y1="455" x2="85" y2="470" stroke="#f4f1ea" stroke-width="3" stroke-linecap="round"/>
    <text x="75" y="410" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10" fill="#f4f1ea">человек</text>
  </g>

  <!-- Core -->
  <rect x="360" y="265" width="200" height="110" fill="#0f2a4a" stroke="#ff6b57" stroke-width="1.4"/>
  <text x="460" y="293" text-anchor="middle" font-family="Consolas, monospace" font-weight="700" font-size="16" fill="#ff6b57">CORE</text>
  <text x="460" y="311" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="11" fill="#9db8d6">Центр</text>
  <text x="460" y="333" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#6f8fb3">GOAL.md — вердикт</text>
  <text x="460" y="347" text-anchor="middle" font-family="Consolas, monospace" font-size="10" fill="#6f8fb3">PROJECT.md — пороги</text>

  <text x="460" y="620" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#9db8d6">сплошная — прямой ход круга · пунктир жёлтый — возврат/эскалация · пунктир голубой — надзор Core</text>
</svg>
