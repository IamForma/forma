  <line x1="499" y1="216" x2="616" y2="216" stroke="#5f7fa3" stroke-width="3" stroke-linecap="round"/>
  <line x1="499" y1="230" x2="559" y2="230" stroke="#3f5b80" stroke-width="2" stroke-linecap="round"/>

  <rect x="487" y="258" width="141" height="44" rx="4" fill="#153a63" stroke="#7be0a8" stroke-width="1"/>
  <line x1="499" y1="274" x2="616" y2="274" stroke="#5f7fa3" stroke-width="3" stroke-linecap="round"/>
  <line x1="499" y1="288" x2="559" y2="288" stroke="#3f5b80" stroke-width="2" stroke-linecap="round"/>

  <rect x="487" y="316" width="141" height="44" rx="4" fill="#153a63" stroke="#7be0a8" stroke-width="1"/>
  <line x1="499" y1="332" x2="616" y2="332" stroke="#5f7fa3" stroke-width="3" stroke-linecap="round"/>
  <line x1="499" y1="346" x2="559" y2="346" stroke="#3f5b80" stroke-width="2" stroke-linecap="round"/>

  <!-- Intent column: 688..859 -->
  <rect x="688" y="40" width="171" height="120" fill="#0f2a4a" stroke="#6f9bd1"/>
  <rect x="688" y="40" width="5" height="120" fill="#b98cff"/>
  <text x="773.5" y="68" text-anchor="middle" font-family="Consolas, monospace" font-weight="700" font-size="17" fill="#eaf2fb">INTENT</text>
  <text x="773.5" y="90" text-anchor="middle" font-family="Segoe UI, sans-serif" font-weight="700" font-size="13" fill="#eaf2fb">Готово</text>
  <text x="773.5" y="108" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#9db8d6">Замысел</text>
  <text x="773.5" y="124" text-anchor="middle" font-family="Consolas, monospace" font-size="9.5" fill="#6f8fb3">done</text>

  <rect x="703" y="200" width="141" height="44" rx="4" fill="#153a63" stroke="#b98cff" stroke-width="1"/>
  <line x1="715" y1="216" x2="832" y2="216" stroke="#5f7fa3" stroke-width="3" stroke-linecap="round"/>
  <line x1="715" y1="230" x2="775" y2="230" stroke="#3f5b80" stroke-width="2" stroke-linecap="round"/>

  <rect x="703" y="258" width="141" height="44" rx="4" fill="#153a63" stroke="#b98cff" stroke-width="1"/>
  <line x1="715" y1="274" x2="832" y2="274" stroke="#5f7fa3" stroke-width="3" stroke-linecap="round"/>
  <line x1="715" y1="288" x2="775" y2="288" stroke="#3f5b80" stroke-width="2" stroke-linecap="round"/>

  <rect x="703" y="316" width="141" height="44" rx="4" fill="#153a63" stroke="#b98cff" stroke-width="1"/>
  <line x1="715" y1="332" x2="832" y2="332" stroke="#5f7fa3" stroke-width="3" stroke-linecap="round"/>
  <line x1="715" y1="346" x2="775" y2="346" stroke="#3f5b80" stroke-width="2" stroke-linecap="round"/>

  <!-- Core ties: reaches up into all four columns from below -->
  <line x1="125.5" y1="430" x2="125.5" y2="362" stroke="#a9d0f5" stroke-width="1.8" stroke-dasharray="2 4" marker-end="url(#kb-ah-core)"/>
  <line x1="341.5" y1="430" x2="341.5" y2="362" stroke="#a9d0f5" stroke-width="1.8" stroke-dasharray="2 4" marker-end="url(#kb-ah-core)"/>
  <line x1="557.5" y1="430" x2="557.5" y2="362" stroke="#a9d0f5" stroke-width="1.8" stroke-dasharray="2 4" marker-end="url(#kb-ah-core)"/>
  <line x1="773.5" y1="430" x2="773.5" y2="362" stroke="#a9d0f5" stroke-width="1.8" stroke-dasharray="2 4" marker-end="url(#kb-ah-core)"/>

  <!-- Core: not a column — the floor under all four -->
  <rect x="40" y="430" width="819" height="55" fill="#0f2a4a" stroke="#ff6b57" stroke-width="1.6"/>
  <text x="449.5" y="453" text-anchor="middle" font-family="Consolas, monospace" font-weight="700" font-size="16" fill="#ff6b57">CORE</text>
  <text x="449.5" y="472" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="10.5" fill="#9db8d6">предел — держит и определяет успех всех четырёх, а не одной карточки</text>

  <text x="449.5" y="520" text-anchor="middle" font-family="Segoe UI, sans-serif" font-size="12" fill="#9db8d6">слева направо — путь карточки по доске · пунктир снизу — Core связывает и ограничивает все четыре узла</text>
</svg>
