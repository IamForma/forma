<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Форма как канбан-доска: Spec — входящий лог, Kit — определение, Run — процесс, Intent — готово, Core снизу как предел, связывающий все четыре">
  <defs>
    <marker id="kb-ah-forward" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#eaf2fb"/>
    </marker>
    <marker id="kb-ah-core" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a9d0f5"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="900" height="560" fill="#0f2a4a"/>

  <!-- forward flow between columns: Spec -> Kit -> Run -> Intent -->
  <line x1="211" y1="175" x2="256" y2="175" stroke="#eaf2fb" stroke-width="2" marker-end="url(#kb-ah-forward)"/>
  <text x="233.5" y="169" text-anchor="middle" font-family="Consolas, monospace" font-size="9.5" fill="#eaf2fb">снаряжение</text>

  <line x1="427" y1="175" x2="472" y2="175" stroke="#eaf2fb" stroke-width="2" marker-end="url(#kb-ah-forward)"/>
  <text x="449.5" y="169" text-anchor="middle" font-family="Consolas, monospace" font-size="9.5" fill="#eaf2fb">исполнение</text>

  <line x1="643" y1="175" x2="688" y2="175" stroke="#eaf2fb" stroke-width="2" marker-end="url(#kb-ah-forward)"/>
  <text x="665.5" y="169" text-anchor="middle" font-family="Consolas, monospace" font-size="9.5" fill="#eaf2fb">сверка</text>

  <!-- Spec column: 40..211 -->
  <rect x="40" y="40" width="171" height="120" fill="#0f2a4a" stroke="#6f9bd1"/>
