  <text x="125.5" y="124" text-anchor="middle" font-family="Consolas, monospace" font-size="9.5" fill="#6f8fb3">backlog</text>

  <rect x="55" y="200" width="141" height="44" rx="4" fill="#153a63" stroke="#a8ecff" stroke-width="1"/>
  <line x1="67" y1="216" x2="184" y2="216" stroke="#5f7fa3" stroke-width="3" stroke-linecap="round"/>
  <line x1="67" y1="230" x2="127" y2="230" stroke="#3f5b80" stroke-width="2" stroke-linecap="round"/>

  <rect x="55" y="258" width="141" height="44" rx="4" fill="#153a63" stroke="#a8ecff" stroke-width="1"/>
