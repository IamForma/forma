  <line x1="283" y1="216" x2="400" y2="216" stroke="#5f7fa3" stroke-width="3" stroke-linecap="round"/>
  <line x1="283" y1="230" x2="343" y2="230" stroke="#3f5b80" stroke-width="2" stroke-linecap="round"/>

  <rect x="271" y="258" width="141" height="44" rx="4" fill="#153a63" stroke="#a3c1ff" stroke-width="1"/>
  <line x1="283" y1="274" x2="400" y2="274" stroke="#5f7fa3" stroke-width="3" stroke-linecap="round"/>
  <line x1="283" y1="288" x2="343" y2="288" stroke="#3f5b80" stroke-width="2" stroke-linecap="round"/>

  <rect x="271" y="316" width="141" height="44" rx="4" fill="#153a63" stroke="#a3c1ff" stroke-width="1"/>
  <line x1="283" y1="332" x2="400" y2="332" stroke="#5f7fa3" stroke-width="3" stroke-linecap="round"/>
  <line x1="283" y1="346" x2="343" y2="346" stroke="#3f5b80" stroke-width="2" stroke-linecap="round"/>

  <!-- Run column: 472..643 -->
  <rect x="472" y="40" width="171" height="120" fill="#0f2a4a" stroke="#6f9bd1"/>
  <rect x="472" y="40" width="5" height="120" fill="#7be0a8"/>
  <text x="557.5" y="68" text-anchor="middle" font-family="Consolas, monospace" font-weight="700" font-size="17" fill="#eaf2fb">RUN</text>
  <text x="557.5" y="90" text-anchor="middle" font-family="Segoe UI, sans-serif" font-weight="700" font-size="13" fill="#eaf2fb">Процесс</text>
  <text x="557.5" y="108" text-anchor="middle" font-family="Consolas, monospace" font-size="10.5" fill="#9db8d6">Исполнение</text>
