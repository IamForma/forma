<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>grill</title>
<style>
  :root {
    --bg: #f7f4ee; --panel: #ffffff; --ink: #1f1c18; --ink-2: #625b51; --ink-3: #9a9285;
    --rule: #e6e0d4; --accent: #9a3a26; --ok: #3d6b4a; --ok-soft: #e3eee5; --stage: #b8791f; --stage-soft: #f8ecd2; --warn-soft: #fbe9e4;
    --serif: "Iowan Old Style", Charter, Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: var(--sans); font-size: 15px; line-height: 1.5; color: var(--ink); background: var(--bg);
    display: grid; grid-template-rows: auto auto 1fr auto; grid-template-columns: 260px minmax(0, 1fr) 33vw; height: 100vh;
  }
  a { color: var(--accent); }
  /* Rows are pinned: the banner is display:none most of the time, and auto-placement would
     otherwise slide the content into the "auto" row and stretch the footer into the "1fr" row. */
  #banner { grid-row: 1; grid-column: 1 / -1; display: none; padding: 9px 24px; font-size: 14px; background: var(--warn-soft); color: var(--accent); border-bottom: 1px solid var(--rule); }
  #banner.show { display: block; } #banner.done { background: var(--ok-soft); color: var(--ok); }

  header { grid-row: 2; grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 12px 24px; border-bottom: 1px solid var(--rule); background: var(--panel); position: relative; }
  header h1 { font-family: var(--serif); font-weight: 500; font-size: 20px; margin: 0; }
  header .path { color: var(--ink-3); font-size: 13px; }
  header .status { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); } header .status .spin { color: var(--stage); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
  .dot.working { background: var(--stage); animation: pulse 1.2s ease-in-out infinite; }
  .dot.gone { background: var(--ink-3); }
  @keyframes pulse { 50% { opacity: .3; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  .attach-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  .attach-formats { color: var(--ink-3); font-size: 12px; }
  .attach-why { color: var(--ink-3); font-size: 12px; }
  .attach-row { flex-wrap: wrap; }
  .ok-mark { display: inline-block; color: var(--ok); font-size: 12px; font-weight: 700; margin-right: 6px; vertical-align: -1px; flex-shrink: 0; }
  .spin { display: inline-block; width: 11px; height: 11px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -1px; flex-shrink: 0; }
  #progress { display: none; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; overflow: hidden; background: var(--stage-soft); }
  header.working #progress { display: block; }
  #progress::after { content: ""; position: absolute; top: 0; bottom: 0; width: 30%; background: var(--stage); animation: slide 1.4s ease-in-out infinite; }
  @keyframes slide { from { left: -30%; } to { left: 100%; } }
  #terms-toggle, #visualize { font-size: 12px; padding: 4px 10px; }
  #visualize .spin { width: 9px; height: 9px; margin-right: 4px; }
  #visualize:disabled { background: var(--panel); border-color: var(--rule); color: var(--ink-3); }
  #terms { display: none; position: absolute; right: 24px; top: 100%; width: 420px; max-height: 60vh; overflow-y: auto; background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 10px 16px; box-shadow: 0 8px 24px rgba(0,0,0,.08); z-index: 5; }
  #terms.show { display: block; }
  .term { padding: 8px 0; border-bottom: 1px solid var(--rule); font-size: 14px; } .term:last-child { border-bottom: 0; }
  .term b { font-family: var(--serif); font-weight: 500; font-size: 15px; } .term .avoid { color: var(--ink-3); font-size: 12px; }

  nav { grid-row: 3; grid-column: 1; border-right: 1px solid var(--rule); overflow-y: auto; padding: 10px 0 24px; }
  nav .note { margin: 6px 14px 4px; padding: 10px 12px; background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; font-size: 13px; color: var(--ink-2); }
  nav .round { padding: 14px 16px 4px 20px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); display: flex; justify-content: space-between; }
  nav .round.current { color: var(--accent); }
  .item { display: grid; grid-template-columns: 26px 1fr auto; gap: 6px; align-items: baseline; padding: 8px 16px 8px 20px; cursor: pointer; }
  .item:hover { background: #efebe3; }
  .item.selected { background: var(--panel); box-shadow: inset 3px 0 0 var(--accent); }
  /* Имя вопроса — метка, а не текст: в четыре строки его читать незачем. */
  .item .id { font-size: 12px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .t { font-size: 14px; }
  .item .mark { font-size: 11px; color: var(--ink-3); display: inline-flex; align-items: center; gap: 4px; }
  .item .mark svg { width: 12px; height: 12px; }
  .mark.answered { color: var(--ok); } .mark.open, .mark.reopened { color: var(--accent); } .mark.staged { color: var(--stage); font-weight: 600; } .mark.pending { color: var(--stage); }
  .item.updated .t::after { content: "обновлено"; font-size: 10px; color: var(--stage); margin-left: 6px; letter-spacing: .06em; text-transform: uppercase; }
  nav .empty { padding: 20px; font-size: 13px; color: var(--ink-3); }

  /* Visualize view: the list and card columns give way to the visual; the right panel becomes its feedback. */
  #visual { grid-row: 3; grid-column: 1 / 3; display: none; grid-template-rows: auto 1fr; min-height: 0; background: var(--panel); }
  body.visualize #visual { display: grid; } body.visualize nav, body.visualize main { display: none; }
  #visual-strip { display: flex; align-items: center; flex-wrap: nowrap; gap: 14px; padding: 8px 24px; border-bottom: 1px solid var(--rule); font-size: 13px; color: var(--ink-2); background: var(--bg); }
  /* Полоса — всегда одна строка: кнопки не переносятся, уступает длинная подпись (усечение, полный текст в title). */
  #visual-strip > * { flex: none; }
  #visual-strip .kind { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--accent); font-weight: 600; white-space: nowrap; }
  #visual-strip .ver { color: var(--ink-3); flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #visual-strip .ver b { color: var(--ink-2); font-weight: 600; }
  #visual-stale { color: var(--stage); font-size: 12px; white-space: nowrap; }
  #visual-strip .right { margin-left: auto; display: flex; align-items: center; flex-wrap: nowrap; gap: 10px; color: var(--stage); white-space: nowrap; }
  #visual-strip a { color: var(--ink-3); text-decoration: none; font-size: 13px; white-space: nowrap; } #visual-strip a:hover { color: var(--accent); }
  /* Во всё окно: визуал забирает и колонку обратной связи. Обратное — режим общения. */
  body.visualize.visual-wide #visual { grid-column: 1 / -1; }
  body.visualize.visual-wide aside { display: none; }
  #visual-strip .wide { color: var(--ink-3); text-decoration: none; font-size: 13px; cursor: pointer; }
  #visual-strip .wide:hover { color: var(--accent); }
  #visual-frame { width: 100%; height: 100%; border: 0; background: #fff; display: block; }
  #visual-wait { display: flex; align-items: center; justify-content: center; gap: 10px; height: 100%; color: var(--ink-3); font-size: 14px; background: #fff; }
  #visual-wait[hidden], #visual-frame[hidden] { display: none; }

  main { grid-row: 3; grid-column: 2; overflow-y: auto; padding: 36px 44px 60px; background: var(--panel); }
  .card { max-width: 680px; }
  .crumb { font-size: 12px; color: var(--ink-3); display: flex; gap: 12px; flex-wrap: wrap; }
  .crumb a { text-decoration: none; } .crumb .upd { color: var(--stage); }
  .title-row { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin: 8px 0 12px; }
  .card h2 { font-family: var(--serif); font-weight: 500; font-size: 30px; line-height: 1.15; margin: 0; }
  #explore { font-size: 13px; padding: 6px 12px; flex-shrink: 0; }
  #explore:disabled { background: var(--panel); border-color: var(--rule); color: var(--ink-3); }
  .card .body { font-size: 15px; color: var(--ink-2); max-width: 62ch; margin: 0; white-space: pre-line; }
  .opts { list-style: none; padding: 0; margin: 24px 0 0; display: grid; gap: 8px; }
  .opt { display: grid; grid-template-columns: 28px 1fr auto; gap: 12px; align-items: start; padding: 12px 14px; border: 1px solid var(--rule); border-radius: 8px; background: var(--panel); cursor: pointer; }
  .opt .check { width: 20px; height: 20px; color: var(--ok); visibility: hidden; align-self: center; }
  .opt .check svg, .mark svg { display: block; width: 100%; height: 100%; }
  .opt:hover { border-color: var(--ink-3); }
  .opt .k { font-family: var(--serif); font-size: 18px; line-height: 1.2; color: var(--ink-3); }
  .opt.rec { border-color: var(--accent); } .opt.rec .k { color: var(--accent); }
  .opt .tag { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); margin-bottom: 2px; }
  .opt.chosen { background: var(--ok-soft); border-color: var(--ok); } .opt.chosen .k, .opt.chosen .tag { color: var(--ok); } .opt.chosen .check { visibility: visible; }
  /* Once an answer is picked (staged or recorded), everything but the picked box reads as disabled; hover or focus wakes a part back up. */
  .card.picked .body, .card.picked .why, .card.picked .answer-row, .card.picked .links, .card.picked .opt:not(.chosen):not(.staged):not(.pending) { opacity: .45; transition: opacity .15s; }
  .card.picked .opt:not(.chosen):not(.staged):not(.pending):hover, .card.picked .answer-row:focus-within, .card.picked .links:hover { opacity: 1; }
  .opt.text-answer { cursor: default; } .opt.text-answer .tag { color: var(--ok); } .opt.text-answer:hover { border-color: var(--ok); }
  .opt.staged { border-color: var(--stage); box-shadow: 0 0 0 1px var(--stage); background: var(--stage-soft); }
  .opt.pending { border-color: var(--stage); border-style: dashed; } .opt.pending .k { color: var(--stage); } .opt .check.pending { visibility: visible; color: var(--stage); display: flex; align-items: center; justify-content: center; }
  .locked .opt { cursor: default; } .locked .opt:hover { border-color: var(--rule); }
  .why { margin: 14px 0 0; font-size: 14px; color: var(--ink-2); white-space: pre-line; } .why b { color: var(--accent); font-weight: 600; }
  /* Поле ответа растёт под текст: диктуя длинно, человек не должен терять из
     виду собственные слова. Предел — чтобы карточка не уезжала целиком. */
  .answer-row textarea { min-height: 76px; max-height: 45vh; overflow-y: auto; }
  .staged-line { margin-top: 10px; font-size: 14px; color: var(--stage); } .staged-line a { color: var(--ink-3); font-size: 12px; margin-left: 8px; }
  .pending-line { margin-top: 10px; font-size: 14px; color: var(--stage); display: flex; align-items: center; gap: 8px; }
  .answer-row { display: flex; gap: 8px; margin-top: 20px; align-items: flex-start; }
  .links { margin-top: 12px; font-size: 13px; display: flex; gap: 14px; } .links a { color: var(--ink-3); text-decoration: none; } .links a:hover { color: var(--accent); }
  textarea { width: 100%; min-height: 60px; font: inherit; font-size: 14px; padding: 10px 12px; border: 1px solid var(--rule); border-radius: 8px; background: var(--panel); resize: vertical; color: var(--ink); }
  textarea:focus { outline: none; border-color: var(--ink-3); }
  button { font-family: var(--sans); font-weight: 500; font-size: 14px; padding: 9px 14px; border-radius: 8px; border: 1px solid var(--rule); background: var(--panel); color: var(--ink); cursor: pointer; white-space: nowrap; }
  button:hover { border-color: var(--ink-3); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; } button.primary:hover { border-color: var(--accent); }
  button:disabled, button.primary:disabled { background: var(--ink-3); border-color: var(--ink-3); color: #fff; cursor: default; }
  main .empty { color: var(--ink-3); font-size: 14px; }

  aside { grid-row: 3; grid-column: 3; border-left: 1px solid var(--rule); display: grid; grid-template-rows: auto 1fr auto; min-height: 0; }
  aside .head { padding: 20px 22px 12px; }
  aside .head h3 { margin: 0; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; }
  aside .head .sub { font-family: var(--serif); font-size: 16px; margin-top: 4px; }
  aside .head .count { font-size: 12px; color: var(--ink-3); margin-left: 8px; font-family: var(--sans); }
  aside .msgs { overflow-y: auto; padding: 0 22px 12px; }
  .msg { padding: 12px 0; border-top: 1px solid var(--rule); position: relative; }
  .msg .who { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 4px; }
  .msg.user .who { color: var(--stage); } .msg.agent .who { color: var(--accent); }
  .msg.staged { background: var(--stage-soft); margin: 8px -10px 0; padding: 10px 28px 10px 10px; border-radius: 6px; border-top: 0; }
  .msg.pending { opacity: .7; } .msg.pending .who { display: flex; align-items: center; gap: 6px; }
  .msg .text { font-size: 14px; white-space: pre-line; }
  .msg .rm { position: absolute; right: 8px; top: 8px; color: var(--ink-3); text-decoration: none; font-size: 14px; }
  .empty-thread { padding: 12px 0; font-size: 13px; color: var(--ink-3); border-top: 1px solid var(--rule); }
  .explore-head { padding: 12px 0 6px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; border-top: 1px solid var(--rule); }
  .explore-wait { padding: 12px 0; font-size: 13px; color: var(--stage); border-top: 1px solid var(--rule); }
  .procon { width: 100%; border-collapse: collapse; font-size: 13px; margin: 2px 0 10px; }
  .procon th { text-align: left; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); font-weight: 600; padding: 6px 8px 6px 0; border-bottom: 1px solid var(--rule); }
  .procon td { vertical-align: top; padding: 8px 8px 8px 0; border-bottom: 1px solid var(--rule); }
  .procon td.k { font-family: var(--serif); font-size: 16px; color: var(--ink-2); width: 28px; } .procon td.k.rec { color: var(--accent); }
  .procon ul { margin: 0; padding-left: 16px; } .procon li { margin: 0 0 3px; }
  .procon .pro li::marker { color: var(--ok); } .procon .con li::marker { color: var(--accent); }
  aside .compose { padding: 12px 22px 18px; border-top: 1px solid var(--rule); display: grid; gap: 8px; }

  footer { grid-row: 4; grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 12px 24px; border-top: 1px solid var(--rule); background: var(--panel); }
  footer .staged-list { font-size: 13px; color: var(--ink-2); flex: 1; } footer .staged-list b { color: var(--stage); } footer .staged-list .sent { color: var(--stage); display: inline-flex; align-items: center; gap: 6px; }
  #finish.ready { background: var(--ok); border-color: var(--ok); color: #fff; font-weight: 600; animation: ready 1.2s ease-in-out infinite; }
  #finish.ready:hover { background: #2f5a3b; border-color: #2f5a3b; }
  @keyframes ready { 0%, 100% { background-color: var(--ok); border-color: var(--ok); } 50% { background-color: #7fb08d; border-color: #7fb08d; } }
  footer .hint { font-size: 12px; color: var(--ink-3); } footer .warn { font-size: 12px; color: var(--accent); }
  footer .confirm { font-size: 13px; color: var(--ink-2); display: flex; gap: 8px; align-items: center; }
  #finish:disabled { background: var(--panel); border-color: var(--rule); color: var(--ink-3); animation: none; } #finish .spin { margin-right: 4px; }

  .mic-btn { flex-shrink: 0; display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; padding: 0; border-radius: 50%; }
  .mic-btn svg { width: 18px; height: 18px; }
  .mic-btn.recording { background: var(--accent); border-color: var(--accent); color: #fff; }
  .mic-meter { display: none; align-items: flex-end; gap: 3px; height: 20px; align-self: center; }
  .mic-meter.on { display: inline-flex; }
  .mic-meter span { display: block; width: 3px; height: 4px; border-radius: 2px; background: var(--accent); transition: height .08s ease-out; }
  .compose-actions { display: flex; gap: 8px; align-items: center; justify-self: end; }
</style>
</head>
<body>
<div id="banner"></div>
<header>
  <h1 id="topic">grill</h1>
  <span class="path" id="doc-path"></span>
  <button id="terms-toggle" type="button">Термины</button>
  <div id="terms"></div>
  <button id="visualize" type="button" hidden>Визуализация</button>
  <span class="status"><span class="dot" id="agent-dot"></span><span id="agent-status">подключение…</span></span>
  <div id="progress"></div>
</header>
<nav id="nav"><div class="empty">Подключение…</div></nav>
<main id="main"></main>
<section id="visual"><div id="visual-strip"></div><div id="visual-wait" hidden><span class="spin"></span>Рисуем первую версию…</div><iframe id="visual-frame" title="Визуал" sandbox="allow-scripts"></iframe></section>
<aside id="aside"></aside>
<footer>
  <span class="staged-list" id="staged-list"></span>
  <span class="warn" id="send-why"></span>
  <span class="hint">⌘↩ отправить</span>
  <span id="finish-area"></span>
  <button class="primary" id="send" type="button" disabled>Отправить агенту</button>
</footer>
<script>
"use strict";

// ---- translations (T) — единственная точка правки текста интерфейса; ----
// код ниже обращается к T, а не хранит английские/русские строки инлайн — так
// диффы апстрима остаются логическими правками, не текстовыми.
const T = {
  terms: "Термины",
  termsWithCount: (n) => `Термины${n ? " · " + n : ""}`,
  visualize: "Визуализация",
  visualizeBack: "Вопросы",
  wideOn: "Во всё окно",
  wideOff: "Режим общения",
  wideOnHint: "Развернуть визуал на всё окно — когда детали слишком мелкие (Esc — обратно)",
  wideOffHint: "Вернуть колонку обратной связи",
  visualLabel: (v) => `Визуал · v${v}`,
  visualizing: "Визуализация…",
  visualizeHint: "Нарисовать прототип или диаграмму текущего замысла",
  connecting: "подключение…",
  connectingNav: "Подключение…",
  drawingFirst: "Рисуем первую версию…",
  sendToAgent: "Отправить агенту",
  sendNToAgent: (n) => `Отправить агенту (${n})`,
  drawStuck: "Рисование идёт больше 10 минут; перегенерируйте, чтобы попробовать снова.",
  serverGone: "сервер недоступен",
  agentBusyWarn: (t) => `Агент работает уже ${t}; возможно, он не слушает.`,
  sendWaitingWarn: (seq, ms) => `Отправка #${seq} ушла ${ms} назад, агент ещё не забрал её. Отвечать дальше можно — отправки разбираются по порядку.`,
  sendFailed: "Отправка не удалась: ",
  noServer: "нет связи с сервером",
  finishedBanner: (doc, visual, at) => `Завершено · документ записан в ${doc}${visual ? ", визуал — в " + visual : ""}${at ? " в " + at : ""}.`,
  serverGoneBanner: "Сервер недоступен. Возобновите грилл из терминала — вкладка переподключится сама.",
  avoid: "Не использовать: ",
  noTermsYet: "Пока нет терминов. Агент добавляет их сюда по мере того, как они устаканиваются.",
  agentBusyTitle: "агент занят",
  diagram: "Диаграмма",
  prototype: "Прототип",
  firstVersionOnWay: "первая версия уже в пути",
  outOfDate: "Устарело · перегенерируйте, чтобы учесть последние решения",
  regenerating: "перегенерация…",
  regenerate: "Перегенерировать",
  agentWorking: (t) => `Агент работает · ${t}`,
  agentWaiting: (since, handled) => `Агент ждёт вас${since ? " · с " + since : ""}${handled ? " · обработано #" + handled : ""}`,
  waitingFirstRound: "Ждём первый раунд…",
  round: (r) => `Раунд ${r}`,
  currentSuffix: " · текущий",
  pickQuestion: "Выберите вопрос слева.",
  noQuestionsYet: "Пока нет вопросов.",
  crumbRound: (r) => `раунд ${r}`,
  after: (list) => `после ${list}`,
  root: "корень",
  durable: "трудно обратимо",
  recUpdated: "рекомендация обновлена",
  deferred: "отложено",
  reopened: "переоткрыто",
  statusOpen: "открыт",
  recommended: "Рекомендовано",
  yourAnswer: "Ваш ответ",
  yourAnswerSending: "Ваш ответ · ушло",
  whyOption: (o) => `Почему ${o}.`,
  suggested: "Предложено.",
  stagedDefer: "В очереди: отложить этот вопрос",
  stagedReopen: "В очереди: переоткрыть этот вопрос",
  stagedAccept: (o) => `В очереди: принять ${o}`,
  stagedOption: (o) => `В очереди: вариант ${o}`,
  // Показываем текст целиком: обрезка прятала бы то, что человек уже надиктовал,
  // и потерю части снова было бы не видно.

// ---- data helpers ----
const qs = () => (S && Array.isArray(S.questions) ? S.questions : []);

async function poll() {

function renderFooter() {

    if (s.thread && s.thread.length) bits.push(T.msgCountShort(s.thread.length));

  });

  list.innerHTML = locked() ? T.finishedFooter : n ? `<b>${n} ${ruPlural(n, ["в очереди", "в очереди", "в очереди"])}</b> · ${parts.join(" · ")}${sent ? " · " + sent : ""}` : sent || T.nothingStaged;

  if (locked()) fa.innerHTML = "";

    // Кружок значит «идёт прямо сейчас», а идёт оно не у нас. Отправка состоялась — галочка.
    fa.innerHTML = ms > FINISH_STALE_MS

  }

  else {

    fa.innerHTML = `<button id="finish" type="button" class="${ready ? "ready" : ""}"${gate.disabled ? " disabled" : ""}${ready ? ` title="${T.finishReadyTitle}"` : gate.disabled && gate.why ? ` title="${esc(gate.why)}"` : ""}>${T.finishGrill}</button>`;
